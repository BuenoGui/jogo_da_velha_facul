<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogando</title>
    <!-- criar um timer que vai deixar [jogando até jogando...] e em ciclo durante o game -->

    <!-- importar as fontes do customizar -->

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/novo.css">

</head>
<body>
    <main>
        <header>
            <div>
                <!-- iniciar o timer dpois da primeira jogada -->
                <span class="timer">0.00</span>
            </div>

            <button class="voltar"><a href="../../index.html">X</a></button>
        </header>

        <h1>
            <div>
                <div class="placar">
                    <span class="peca X">X: 0</span>
                    <span class="peca O">O: 0</span>
                    <span class="peca">#: 0</span>
                </div>
                <div class="time_jogando">
                    <h3>Turno de: <span class="peca X">X</span></h3>
                </div>
            </div>
        </h1>

        <div class="tabuleiro">
        </div>

        <!-- <div class="vitoria">
            <h2>Vitoria do time: <span class="peca O">O</span></h2>

            <button class="continuar"> continuar </button>
        </div> -->

    </main>


    <script src="../js/jogo.js"></script>
</body>
</html>
